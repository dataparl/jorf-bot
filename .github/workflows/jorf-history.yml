name: jorf-history
# Balayage JORF d'une plage de dates au choix (rattrapage d'historique) :
# déclenchement manuel depuis l'onglet Actions (date de début obligatoire,
# date de fin facultative — hier par défaut). Chaque push sur main fait aussi
# tourner le diagnostique (accès DILA + tables Supabase) et publie le journal
# complet sur la branche « logs », lisible sans accès Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      date_debut:
        description: "Date de début du balayage (YYYY-MM-DD)"
        required: true
        type: string
      date_fin:
        description: "Date de fin (YYYY-MM-DD) — hier par défaut"
        required: false
        type: string

permissions:
  contents: write

jobs:
  jorf-history:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Diagnostique (DILA + Supabase)
        env:
          DATA_SUPABASE_URL: ${{ secrets.DATA_SUPABASE_URL }}
          DATA_SUPABASE_KEY: ${{ secrets.DATA_SUPABASE_KEY }}
          DATA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DATA_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          {
            echo "== jorf-history $(date -u +%FT%TZ) (run ${{ github.run_id }}) =="
            node bin/jorf-bot.js diagnostique
            echo "== Statut avant balayage =="
            node bin/jorf-bot.js statut
          } 2>&1 | tee diagnostique.log
      - name: "Balayage ${{ inputs.date_debut }} -> ${{ inputs.date_fin || 'hier' }}"
        if: github.event_name == 'workflow_dispatch' && inputs.date_debut != ''
        env:
          DATA_SUPABASE_URL: ${{ secrets.DATA_SUPABASE_URL }}
          DATA_SUPABASE_KEY: ${{ secrets.DATA_SUPABASE_KEY }}
          DATA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DATA_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node bin/jorf-bot.js balayer "${{ inputs.date_debut }}" ${{ inputs.date_fin && format('"{0}"', inputs.date_fin) || '' }} 2>&1 | tee balayage.log
      - name: Statut après balayage
        if: always()
        env:
          DATA_SUPABASE_URL: ${{ secrets.DATA_SUPABASE_URL }}
          DATA_SUPABASE_KEY: ${{ secrets.DATA_SUPABASE_KEY }}
          DATA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DATA_SUPABASE_SERVICE_ROLE_KEY }}
        run: node bin/jorf-bot.js statut 2>&1 | tee statut.log
      - name: Publier le journal sur la branche logs
        if: always()
        run: |
          cat diagnostique.log balayage.log statut.log > jorf-history.log 2>/dev/null || cat diagnostique.log statut.log > jorf-history.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin logs --depth=1 || true
          git switch -c logs
          git add -f jorf-history.log
          git commit -m "journal jorf-history (run ${{ github.run_id }})"
          git push origin logs --force
