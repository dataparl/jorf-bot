name: corpus
# Import one-shot du dump Freemium global (cabinets ministériels 2012 -> date du dump).
# L'archive .tar.gz doit être publiée dans une Release du dépôt (asset nommé
# Freemium_jorf_global_*.tar*) — Actions la télécharge et lit en streaming.
# Pas d'accès DILA ici : l'IP du runner ne pose donc aucun problème.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Tag de la Release contenant l'archive (défaut : la plus récente)"
        required: false
        type: string
      debut:
        description: "Date de début (YYYY-MM-DD)"
        required: true
        default: "2012-01-01"
        type: string
      fin:
        description: "Date de fin (YYYY-MM-DD) — défaut : 2025-07-13 (date du dump)"
        required: false
        default: "2025-07-13"
        type: string

permissions:
  contents: write

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Télécharger l'archive depuis la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh release download [<tag>] : sans tag = release la plus récente
          if [ -n "${{ inputs.release }}" ]; then
            gh release download "${{ inputs.release }}" --repo "${{ github.repository }}" --pattern "Freemium_jorf_global_*.tar*"
          else
            gh release download --repo "${{ github.repository }}" --pattern "Freemium_jorf_global_*.tar*"
          fi
          ls -lh Freemium_jorf_global_*.tar*
      - name: Échantillons (extraits vers la branche logs pour analyse hors CI)
        run: |
          A=$(ls Freemium_jorf_global_*.tar* | head -1)
          extraire () {
            # $1 = wildcard tar, $2 = fichier sortie, $3 = motif, $4 = nb max
            timeout 1800 tar -xzOf "$A" --wildcards "$1" 2>/dev/null | awk -v motif="$3" -v max="$4" '
              /<\?xml/ {if (buf ~ motif) {print buf; c++; if (c>=max) exit} buf=$0; next}
              {buf=buf RS $0}
              END {if (buf ~ motif) print buf}
            ' > "$2" || true
            echo "$2 : $(wc -c < "$2") octets"
          }
          extraire 'jorf/global/article/*' echantillon-article.xml 'nomination|PERSONNE' 3
          extraire 'jorf/global/texte/struct/*' echantillon-texte.xml 'nomination|PERSONNE' 3
          extraire 'jorf/global/section_ta/*' echantillon-section.xml 'nomination|PERSONNE' 2
          {
            echo "== échantillons extraits =="
            for f in echantillon-*.xml; do echo "-- $f : $(wc -c < $f) octets"; done
            echo "== aperçu article =="
            head -c 4000 echantillon-article.xml || true
          } 2>&1 | tee -a corpus.log
      - name: "Corpus ${{ inputs.debut }} -> ${{ inputs.fin }}"
        env:
          DATA_SUPABASE_URL: ${{ secrets.DATA_SUPABASE_URL }}
          DATA_SUPABASE_KEY: ${{ secrets.DATA_SUPABASE_KEY }}
          DATA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DATA_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node bin/jorf-bot.js corpus Freemium_jorf_global_*.tar* "${{ inputs.debut }}" "${{ inputs.fin }}" 2>&1 | tee -a corpus.log
      - name: Publier le journal sur la branche logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin logs --depth=1 || true
          git switch -c logs
          {
            echo "== corpus run ${{ github.run_id }} ($(date -u +%FT%TZ)) =="
            echo "== taille totale du journal : $(wc -l < corpus.log) lignes =="
            echo "== résumé (lignes par jour) =="
            grep -E '^20[0-9]{2}-[0-9]{2}-[0-9]{2} ' corpus.log | head -5000 || true
            echo "== premier 200 Ko =="
            head -c 200000 corpus.log || true
            echo ""
            echo "== dernier 300 Ko =="
            tail -c 300000 corpus.log || true
          } > corpus-${{ github.run_id }}.log
          git add -f corpus-${{ github.run_id }}.log echantillon-*.xml || true
          git commit -m "journal corpus (run ${{ github.run_id }})"
          git push origin logs --force
