name: corpus
# Import one-shot du dump Freemium global (cabinets ministériels 2012 -> date du dump).
# L'archive .tar.gz doit être publiée dans une Release du dépôt (asset nommé
# Freemium_jorf_global_*.tar*) — Actions la télécharge et lit en streaming.
# Pas d'accès DILA ici : l'IP du runner ne pose donc aucun problème.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Tag de la Release contenant l'archive (défaut : la plus récente)"
        required: false
        type: string
      debut:
        description: "Date de début (YYYY-MM-DD)"
        required: true
        default: "2012-01-01"
        type: string
      fin:
        description: "Date de fin (YYYY-MM-DD) — défaut : 2025-07-13 (date du dump)"
        required: false
        default: "2025-07-13"
        type: string

permissions:
  contents: write

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Télécharger l'archive depuis la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh release download [<tag>] : sans tag = release la plus récente
          if [ -n "${{ inputs.release }}" ]; then
            gh release download "${{ inputs.release }}" --repo "${{ github.repository }}" --pattern "Freemium_jorf_global_*.tar*"
          else
            gh release download --repo "${{ github.repository }}" --pattern "Freemium_jorf_global_*.tar*"
          fi
          ls -lh Freemium_jorf_global_*.tar*
      - name: Diagnostic archive (vérité terrain, publié dans corpus.log)
        run: |
          A=$(ls Freemium_jorf_global_*.tar* | head -1)
          {
            echo "== fichier =="; ls -lh "$A"
            echo "== répartition des entrées par sous-dossier (listing complet) =="
            timeout 900 tar -tzf "$A" | awk -F/ 'NF>2{print $2"/"$3}' | sort | uniq -c | sort -rn | head -15
            P_CONT=$(timeout 900 tar -tzf "$A" | grep -m1 "CONT.*\\.xml$")
            echo "== échantillon CONT : $P_CONT =="
            timeout 300 tar -xzOf "$A" "$P_CONT" | head -c 2500
            echo ""
            P_EL=$(timeout 900 tar -tzf "$A" | grep -m1 "/eli/")
            echo "== échantillon eli : $P_EL =="
            timeout 300 tar -xzOf "$A" "$P_EL" | head -c 2500
            echo ""
            echo "== premier chemin contenant 'eli' listing 5 =="
            timeout 900 tar -tzf "$A" | grep -m5 "/eli/"
            P_TX=$(timeout 900 tar -tzf "$A" | grep -m1 "/global/texte/.*\\.xml$")
            echo "== échantillon texte : $P_TX =="
            timeout 300 tar -xzOf "$A" "$P_TX" | head -c 2500
            echo ""
            echo "== le même contient-il 'nomination' ? =="
            timeout 300 tar -xzOf "$A" "$P_TX" | grep -ci nomination || true
            echo "== premier ARTICLE contenant nomination/PERSONNE =="
            timeout 1200 tar -xzOf "$A" --wildcards 'jorf/global/article/*' 2>/dev/null | awk '/<\?xml/ {if (buf ~ /nomination|PERSONNE/) {print buf; exit} buf=$0; next} {buf=buf RS $0}' | head -c 5000
            echo ""
            echo "== premier TEXTELR contenant nomination/PERSONNE =="
            timeout 1200 tar -xzOf "$A" --wildcards 'jorf/global/texte/struct/*' 2>/dev/null | awk '/<\?xml/ {if (buf ~ /nomination|PERSONNE/) {print buf; exit} buf=$0; next} {buf=buf RS $0}' | head -c 5000
          } 2>&1 | tee -a corpus.log
      - name: "Corpus ${{ inputs.debut }} -> ${{ inputs.fin }}"
        env:
          DATA_SUPABASE_URL: ${{ secrets.DATA_SUPABASE_URL }}
          DATA_SUPABASE_KEY: ${{ secrets.DATA_SUPABASE_KEY }}
          DATA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DATA_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node bin/jorf-bot.js corpus Freemium_jorf_global_*.tar* "${{ inputs.debut }}" "${{ inputs.fin }}" 2>&1 | tee -a corpus.log
      - name: Publier le journal sur la branche logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin logs --depth=1 || true
          git switch -c logs
          {
            echo "== corpus run ${{ github.run_id }} ($(date -u +%FT%TZ)) =="
            echo "== taille totale du journal : $(wc -l < corpus.log) lignes =="
            echo "== résumé (lignes par jour) =="
            grep -E '^20[0-9]{2}-[0-9]{2}-[0-9]{2} ' corpus.log | head -5000 || true
            echo "== premier 200 Ko =="
            head -c 200000 corpus.log || true
            echo ""
            echo "== dernier 300 Ko =="
            tail -c 300000 corpus.log || true
          } > corpus-${{ github.run_id }}.log
          git add -f corpus-${{ github.run_id }}.log
          git commit -m "journal corpus (run ${{ github.run_id }})"
          git push origin logs --force
