name: rattrapage-cabinets (one-shot)
# Rattrapage unique du trou 14/07/2025 -> hier : la DILA a change de format
# le 13/07/2025 (tar.gz au lieu de zip) et le bot ratait toutes les mesures
# depuis. Ce workflow se declenche au push, balaie toute la fenetre DILA
# disponible avec --forcer (les jours etaient marques balayes a 0 mesure),
# publie son journal sur la branche logs, PUIS SE SUPPRIME (git rm) pour ne
# jamais se relancer. NB : pas de ligne non indentee dans le bloc run
# (une ligne moins indente que le bloc YAML le termine, cf. Signed-off-by).

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rattrapage:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Diagnostique avant rattrapage
        env:
          DATA_SUPABASE_URL: ${{ secrets.DATA_SUPABASE_URL }}
          DATA_SUPABASE_KEY: ${{ secrets.DATA_SUPABASE_KEY }}
          DATA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DATA_SUPABASE_SERVICE_ROLE_KEY }}
        run: node bin/jorf-bot.js diagnostique 2>&1 | tee diagnostique.log
      - name: Rattrapage 2025-07-14 -> hier (--forcer)
        env:
          DATA_SUPABASE_URL: ${{ secrets.DATA_SUPABASE_URL }}
          DATA_SUPABASE_KEY: ${{ secrets.DATA_SUPABASE_KEY }}
          DATA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DATA_SUPABASE_SERVICE_ROLE_KEY }}
        run: node bin/jorf-bot.js balayer 2025-07-14 --forcer 2>&1 | tee rattrapage.log
      - name: Statut apres rattrapage
        if: always()
        env:
          DATA_SUPABASE_URL: ${{ secrets.DATA_SUPABASE_URL }}
          DATA_SUPABASE_KEY: ${{ secrets.DATA_SUPABASE_KEY }}
          DATA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DATA_SUPABASE_SERVICE_ROLE_KEY }}
        run: node bin/jorf-bot.js statut 2>&1 | tee statut.log
      - name: Publier le journal sur la branche logs puis supprimer ce workflow
        if: always()
        run: |
          cat diagnostique.log rattrapage.log statut.log > rattrapage-complet.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin logs --depth=1 || true
          git switch -c logs
          git add -f rattrapage-complet.log || true
          git commit -m "journal rattrapage-cabinets (run ${{ github.run_id }})" || true
          git push origin logs --force
          git switch main 2>/dev/null || git checkout main
          git rm .github/workflows/rattrapage-once.yml .github/workflows/zz-test-parse.yml
          git commit -m "chore: suppression du workflow one-shot de rattrapage (termine)" -m "Signed-off-by: DataParl <support@dataparl.fr>"
          git push origin main
